name: Java compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

jobs:
  java-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Locate standalone Java files
        run: |
          set -eu
          find . -type f -name '*.java' \
            -not -path './.git/*' \
            -not -path './build-classes/*' \
            -not -path './api/src/*' > /tmp/java-sources.txt
          test -s /tmp/java-sources.txt
          cat /tmp/java-sources.txt
      - name: Compile standalone Java source files
        run: |
          set -eu
          mkdir -p build-classes
          javac -encoding UTF-8 -d build-classes @/tmp/java-sources.txt
      - name: Build Spring Boot API
        run: |
          set -eu
          if [ -f api/mvnw ]; then
            chmod +x api/mvnw
            (cd api && ./mvnw --batch-mode --no-transfer-progress test)
          else
            mvn --batch-mode --no-transfer-progress -f api/pom.xml test
          fi
